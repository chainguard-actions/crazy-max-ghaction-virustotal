name: Test glob pattern matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files matching a glob
        run: |
          mkdir -p /tmp/test-glob-dir
          echo "file one content" > /tmp/test-glob-dir/file1.bin
          echo "file two content" > /tmp/test-glob-dir/file2.bin

      - id: action
        uses: .
        with:
          vt_api_key: fake-api-key-for-testing-00000000000000000000000000000000
          files: /tmp/test-glob-dir/*.bin
          update_release_body: 'false'
          request_rate: '0'
        continue-on-error: true

      - name: Assert action attempted upload with glob-matched files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake API key is rejected by VirusTotal
          # This confirms the action correctly resolved the glob and attempted the API call
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' due to invalid API key, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly resolved glob pattern and attempted VirusTotal API call"
