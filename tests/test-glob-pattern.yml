name: Test glob pattern file matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to scan
        run: |
          mkdir -p /tmp/vt-test
          echo "Test binary content 1" > /tmp/vt-test/file1.bin
          echo "Test binary content 2" > /tmp/vt-test/file2.bin

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: "invalid_api_key_for_testing"
          files: |
            /tmp/vt-test/*.bin
          update_release_body: "false"
          request_rate: "0"

      - name: Assert action ran with glob pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With an invalid API key, the action will fail at the API call stage
          # but it should have started and attempted to process the glob pattern
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with glob pattern input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
