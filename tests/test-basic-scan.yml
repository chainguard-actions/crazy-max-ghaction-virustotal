name: Test basic file scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "This is a test file for VirusTotal scanning" > /tmp/test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: "invalid_api_key_for_testing"
          files: "/tmp/test-file.txt"
          update_release_body: "false"
          request_rate: "0"

      - name: Assert action ran (with expected API error or success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (with a real key) or fail with an API error
          # With an invalid key, we expect failure - that's acceptable behavior
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
