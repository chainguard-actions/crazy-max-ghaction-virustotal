name: Test basic usage - VirusTotal scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "hello world" > /tmp/test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: fake-api-key-for-testing
          files: /tmp/test-file.txt
          update_release_body: 'false'
          request_rate: '0'

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with an invalid API key,
          # but it should have been invoked with the required inputs.
          # We accept either success or failure (due to invalid API key).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action was invoked with required inputs"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
