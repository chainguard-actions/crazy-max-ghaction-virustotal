name: Test basic usage - VirusTotal scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "hello world" > /tmp/test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: dummy_api_key_for_testing
          files: /tmp/test-file.txt
          update_release_body: 'false'
          request_rate: '0'

      - name: Assert action ran (API key invalid so outcome is failure or success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to invalid API key)"
