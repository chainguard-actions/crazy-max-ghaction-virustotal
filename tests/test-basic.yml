name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to scan
        run: |
          echo "test file content" > /tmp/test-artifact.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: fake-api-key-for-testing
          files: /tmp/test-artifact.txt
          update_release_body: 'false'
          request_rate: '0'
      - name: Assert action ran (API failure is expected with fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with a fake API key
          # We just verify it ran (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected (outcome: $OUTCOME)"
