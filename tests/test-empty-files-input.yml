name: Test empty files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          vt_api_key: fake-api-key-for-testing
          files: ''
          update_release_body: 'false'
          request_rate: '0'
        continue-on-error: true

      - name: Assert action fails with empty files input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When files input is empty, the action should call core.setFailed
          # which causes the step to fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' when files input is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when files input is empty"
