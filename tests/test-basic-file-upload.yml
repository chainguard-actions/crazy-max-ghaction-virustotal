name: Test basic file upload attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for virustotal scan" > /tmp/test-scan-file.txt

      - id: action
        uses: .
        with:
          vt_api_key: fake-api-key-for-testing-00000000000000000000000000000000
          files: /tmp/test-scan-file.txt
          update_release_body: 'false'
          request_rate: '0'
        continue-on-error: true

      - name: Assert action attempted upload and failed at API
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANALYSIS: ${{ steps.action.outputs.analysis }}
        run: |
          echo "outcome: $OUTCOME"
          echo "analysis: $ANALYSIS"
          # The action should fail because the fake API key is rejected by VirusTotal
          # This confirms the action correctly found the file and attempted the API call
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' due to invalid API key, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at VirusTotal API with invalid key"
          # Analysis output should be empty since upload failed
          if [ -n "$ANALYSIS" ]; then
            echo "FAIL: expected empty analysis output on failure, got '$ANALYSIS'"
            exit 1
          fi
          echo "PASS: analysis output is empty as expected on failure"
