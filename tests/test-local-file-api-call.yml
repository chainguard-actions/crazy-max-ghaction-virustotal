name: Test local file scan with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to scan
        run: |
          echo "test content for virustotal scan" > /tmp/test-scan-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: fake-api-key-for-testing
          files: '/tmp/test-scan-file.txt'
          update_release_body: 'false'
          request_rate: '0'
      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid VirusTotal API key"
