name: Test invalid API key causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "This is a test file for VirusTotal scanning" > /tmp/test-scan-file.txt

      - id: action
        uses: .
        with:
          vt_api_key: invalid-api-key-12345
          files: /tmp/test-scan-file.txt
          update_release_body: 'false'
          request_rate: '0'
        continue-on-error: true

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is invalid"
