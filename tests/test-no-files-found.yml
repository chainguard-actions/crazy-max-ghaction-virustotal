name: Test no files found by glob
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with glob that matches no files
        id: action
        uses: .
        with:
          vt_api_key: fake-api-key-no-files
          files: '*.nonexistent-extension-xyz'
          update_release_body: 'false'

      - name: Assert action succeeded with empty analysis output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANALYSIS: ${{ steps.action.outputs.analysis }}
        run: |
          echo "outcome: $OUTCOME"
          echo "analysis: '$ANALYSIS'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when no files match glob, but got outcome=$OUTCOME"
            exit 1
          fi
          if [ -n "$ANALYSIS" ]; then
            echo "FAIL: expected empty analysis output when no files found, but got: $ANALYSIS"
            exit 1
          fi
          echo "PASS: action succeeded with empty analysis when no files matched glob"
