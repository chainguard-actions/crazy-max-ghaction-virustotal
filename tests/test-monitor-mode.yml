name: Test VirusTotal monitor mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "Test file for monitor mode" > /tmp/monitor-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: "invalid_api_key_for_testing"
          files: "/tmp/monitor-test.txt"
          vt_monitor: "true"
          monitor_path: "/test-uploads"
          update_release_body: "false"
          request_rate: "0"

      - name: Assert action ran in monitor mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With an invalid API key, the action will fail at the API call stage
          # but it should have started and attempted to use the monitor endpoint
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with monitor mode enabled"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
