name: Test VirusTotal Monitor mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "test content for monitor mode" > /tmp/monitor-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          vt_api_key: fake-api-key-for-testing
          files: /tmp/monitor-test.txt
          vt_monitor: 'true'
          monitor_path: '/test-uploads'
          update_release_body: 'false'
          request_rate: '0'

      - name: Assert action ran in monitor mode (failed due to invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key in monitor mode, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key in monitor mode"
