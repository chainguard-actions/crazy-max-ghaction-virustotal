name: Test monitor mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to scan
        run: |
          echo "monitor test file" > /tmp/monitor-test.bin

      - id: vt
        uses: .
        continue-on-error: true
        with:
          vt_api_key: "invalid-api-key-for-testing"
          files: "/tmp/monitor-test.bin"
          vt_monitor: "true"
          monitor_path: "/test-uploads"
          update_release_body: "false"
          request_rate: "4"

      - name: Assert action ran with monitor mode inputs
        env:
          OUTCOME: ${{ steps.vt.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid API key, the action should fail (not skip)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid API key in monitor mode"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded in monitor mode"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' - action should have run"
            exit 1
          fi
