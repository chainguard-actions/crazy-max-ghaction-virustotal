name: Test monitor mode with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          echo "This is a test file for VirusTotal Monitor scanning" > /tmp/test-monitor-file.txt

      - id: action
        uses: .
        with:
          vt_api_key: invalid-api-key-12345
          files: /tmp/test-monitor-file.txt
          vt_monitor: 'true'
          monitor_path: '/test-uploads'
          update_release_body: 'false'
          request_rate: '0'
        continue-on-error: true

      - name: Assert action failed due to invalid API key in monitor mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key in monitor mode, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is invalid in monitor mode"
